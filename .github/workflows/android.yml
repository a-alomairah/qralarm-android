name: Android fork checks
on:
  push:
    branches: [master, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Reuse the test APK signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qralarm-fork-debug-keystore-v1
      - name: Compile debug, run unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain
      - name: Build release without requiring a private signing key
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload debug APK, test APK, schemas and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qralarm-fork-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            app/schemas/
  migration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable emulator acceleration on this ephemeral runner
        run: sudo chmod 666 /dev/kvm
      - name: Test database upgrade and all protection combinations on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qralarm-migration-tests
          path: app/build/reports/androidTests/
